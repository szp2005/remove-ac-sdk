[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "remove-ac"
version = "1.1.2"
description = "Official zero-dependency Python SDK & removebg 1:1 drop-in replacement for remove.ac"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["remove.ac", "remove.bg", "background-removal", "matting", "image-segmentation"]

[project.urls]
Homepage = "https://remove.ac"
Documentation = "https://remove.ac/api-info"
Benchmarks = "https://remove.ac/benchmarks"
Repository = "https://github.com/szp2005/remove-ac-sdk"

[tool.setuptools]
packages = ["remove_ac"]
py-modules = ["removebg"]
