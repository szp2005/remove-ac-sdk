name: Publish to Official MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish-mcp-registry:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'v') && contains(github.event.release.tag_name, '.'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches server.json version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          SRV_VER="$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync("server.json","utf8")).version)')"
          if [ "$RELEASE_TAG" != "v${SRV_VER}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match server.json version v${SRV_VER}"
            exit 1
          fi

      - name: Download and verify mcp-publisher v1.8.9
        run: |
          set -euo pipefail
          URL="https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz"
          EXPECTED_SHA256="4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8"
          curl -fsSL -o /tmp/mcp-publisher.tar.gz "$URL"
          echo "${EXPECTED_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/mcp-publisher.tar.gz -C "$HOME/.local/bin" mcp-publisher
          chmod +x "$HOME/.local/bin/mcp-publisher"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate server.json against Official MCP Registry
        run: mcp-publisher validate

      - name: Authenticate via GitHub OIDC and publish server.json
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
